version: "3.8"

services:
  backend:
    build:
      context: ./backend
    container_name: tomatvla-backend
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      # Add any API keys or local configuration variables here

  frontend:
    build:
      context: ./frontend
    container_name: tomatvla-frontend
    ports:
      - "5173:80" # Maps local port 5173 to Nginx's internal port 80
    depends_on:
      - backend
